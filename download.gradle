// download.gradle — estilo “por directorio” usando Ant (compatible con Gradle 8, sin plugins extra)

tasks.register('satResources') {
    group = 'build setup'
    description = 'Descarga XSD/XSLT del SAT para CFDI 4.0 y complementos'

    doLast {
        // Normaliza enlaces relativos / absolutos
        def normalizeUrl = { String base, String link ->
            if (link.startsWith('http')) return link
            if (link.startsWith('/')) {
                def u = new URL(base)
                return "${u.protocol}://${u.host}${link}"
            }
            return base.endsWith('/') ? base + link : base + '/' + link
        }

        // Intenta listar un "directorio" http y extraer .xsd / .xslt; si falla, usa fallbacks
        def mirrorDir = { String baseUrl, File destDir, List<String> exts, List<String> fallbacks = [] ->
            destDir.mkdirs()
            List<String> urls = []
            try {
                def html = new URL(baseUrl).getText(connectTimeout:10000, readTimeout:20000, useCaches:true)
                def hrefs = (html =~ /href="([^"]+)"/).collect { it[1] }
                urls = hrefs.findAll { h -> exts.any { e -> h.toLowerCase().endsWith(".${e}") } }
                           .collect { h -> normalizeUrl(baseUrl, h) }
                           .unique()
            } catch (Exception e) {
                logger.lifecycle("WARN: No se pudo listar ${baseUrl} (${e.class.simpleName}: ${e.message}). Usaré fallbacks.")
            }
            if (urls.isEmpty() && !fallbacks.isEmpty()) {
                urls = fallbacks.collect { f -> baseUrl.endsWith('/') ? baseUrl + f : baseUrl + '/' + f }
            }
            urls.each { u ->
                def name = u.tokenize('/').last()
                def out = new File(destDir, name)
                ant.get(src: u, dest: out, skipexisting: true)
            }
        }

        /* ===========================
         * CFDI 4.0 + Complementos (SÓLO 4.0)
         * Ajusta según tu xjcGeneration.
         * =========================== */

        // Núcleo CFDI 4.0 (XSD)
        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/4/',
                  file('src/main/resources/xsd/cfd/4'),
                  ['xsd'],
                  ['cfdv40.xsd'])

        // Cadena original CFDI 4.0 (XSLT)
        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/4/cadenaoriginal_4_0/',
                  file('src/main/resources/xslt'),
                  ['xslt'],
                  ['cadenaoriginal_4_0.xslt'])

        // Timbre Fiscal Digital 1.1 (XSD + XSLT)
        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/TimbreFiscalDigital/',
                  file('src/main/resources/xsd/common/TimbreFiscalDigital'),
                  ['xsd'],
                  ['TimbreFiscalDigitalv11.xsd'])
        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/TimbreFiscalDigital/',
                  file('src/main/resources/xslt'),
                  ['xslt'],
                  ['cadenaoriginal_TFD_1_1.xslt'])

        // Catálogos
        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/catalogos/',
                  file('src/main/resources/xsd/common/catalogos'),
                  ['xsd'],
                  ['catCFDI.xsd'])
        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/catalogos/Nomina/',
                  file('src/main/resources/xsd/common/catalogos/Nomina'),
                  ['xsd'],
                  ['catNomina.xsd'])

        // Pagos 2.0 (REP)
        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/Pagos/',
                  file('src/main/resources/xsd/common/Pagos'),
                  ['xsd'],
                  ['Pagos20.xsd'])

        // Complementos (deja solo los que generas)
        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/cfdiregistrofiscal/',
                  file('src/main/resources/xsd/common/cfdiregistrofiscal'),
                  ['xsd'],
                  ['cfdiregistrofiscal.xsd'])

        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/EstadoDeCuentaCombustible/',
                  file('src/main/resources/xsd/common/EstadoDeCuentaCombustible'),
                  ['xsd'],
                  ['ecc12.xsd'])

        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/catalogos/Combustible/',
                  file('src/main/resources/xsd/common/catalogos/Combustible'),
                  ['xsd'],
                  ['catCombustible.xsd'])

        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/consumodecombustibles/',
                  file('src/main/resources/xsd/common/consumodecombustibles'),
                  ['xsd'],
                  ['consumodeCombustibles11.xsd'])

        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/nomina/',
                  file('src/main/resources/xsd/common/nomina'),
                  ['xsd'],
                  ['nomina12.xsd', 'nomina11.xsd'])

        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/donat/',
                  file('src/main/resources/xsd/common/donat'),
                  ['xsd'],
                  ['donat11.xsd'])

        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/implocal/',
                  file('src/main/resources/xsd/common/implocal'),
                  ['xsd'],
                  ['implocal.xsd'])

        mirrorDir('https://www.sat.gob.mx/sitio_internet/cfd/ecb/',
                  file('src/main/resources/xsd/common/ecb'),
                  ['xsd'],
                  ['ecb.xsd'])
    }
}
