//END OF XJC-GEN
//***DO NOT EDIT*** TO HERE

/* =======================
 *  E N C A D E N A M I E N T O   D E   T A R E A S
 * ======================= */
tasks.named("xjcGeneration") { dependsOn("satResources") }
tasks.named("compileJava")   { dependsOn("xjcGeneration") }

// para corregir el validation error: sourcesJar usa salidas de schemaGen_*
tasks.named("sourcesJar") {
    dependsOn("xjcGeneration")
    from("$buildDir/generated-sources")
    from("$buildDir/generated-sources/main/xjc")
    from("$buildDir/generated/sources/xjc")
}

// javadoc también después de generar código
tasks.named("javadoc") {
    dependsOn("xjcGeneration")
    source += fileTree("$buildDir/generated-sources")
    source += fileTree("$buildDir/generated-sources/main/xjc")
    source += fileTree("$buildDir/generated/sources/xjc")
}
tasks.named("javadocJar") { dependsOn("javadoc") }

// evitar duplicados al empacar
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

/* =======================
 *  S O U R C E   S E T S
 * ======================= */
sourceSets {
    main {
        java {
            setSrcDirs([
                'src/main/java',
                "${buildDir}/generated-sources",
                "${buildDir}/generated-sources/main/xjc",
                "${buildDir}/generated/sources/xjc"
            ])
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

/* =======================
 *  D E P E N D E N C I A S
 * ======================= */
dependencies {
    // Código propio (sin Guava/commons-io en esta versión)
    implementation 'ca.juliusdavies:not-yet-commons-ssl:0.3.9'   // PKCS8Key (apache commons-ssl)

    // JAXB Jakarta 4.x (compatible Java 17)
    implementation "jakarta.xml.bind:jakarta.xml.bind-api:4.0.0"
    implementation "org.glassfish.jaxb:jaxb-runtime:${jaxbVersion}"
    implementation "org.glassfish.jaxb:jaxb-core:${jaxbVersion}"
    implementation "jakarta.activation:jakarta.activation-api:2.1.2"

    // Herramientas XJC (classpath de la tarea de generación)
    xjc "jakarta.xml.bind:jakarta.xml.bind-api:4.0.0"
    xjc "org.glassfish.jaxb:jaxb-runtime:${jaxbVersion}"
    xjc "org.glassfish.jaxb:jaxb-core:${jaxbVersion}"
    xjc "org.glassfish.jaxb:jaxb-xjc:${jaxbVersion}"
    xjc "jakarta.activation:jakarta.activation-api:2.1.2"

    testImplementation 'junit:junit:4.13.2'
}
