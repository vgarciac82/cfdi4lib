plugins {
    id 'java-library'
    id 'com.github.edeandrea.xjc-generation' version '1.6'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

apply from: 'download.gradle'

group = 'mx.grupocorasa.cfdibase'   // cámbialo cuando migres el groupId
version = '4.0.18'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

ext {
    jaxbVersion = '4.0.5'
}

/* =======================
 *  X J C   G E N E R A T I O N
 * ======================= */
//***DO NOT EDIT*** FROM HERE
//START OF XJC-GEN
xjcGeneration {
